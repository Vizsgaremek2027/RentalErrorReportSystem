<div class="login-container">
  <h1>Bejelentkezés</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="email">E-mail cím</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
    @if (form.controls.email.touched && form.controls.email.invalid) {
      <p class="field-error" role="alert">Adj meg érvényes e-mail címet.</p>
    }

    <label for="password">Jelszó</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <p class="field-error" role="alert">A jelszó megadása kötelező.</p>
    }

    @if (error()) {
      <p class="field-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="submit-btn">Belépés</button>
  </form>

  <p class="switch-link">Még nincs fiókod? <a routerLink="/register">Regisztráció</a></p>
</div>
